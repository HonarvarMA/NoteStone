<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiny Notes</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- HTML to Image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"
        crossorigin="anonymous"></script>

    <style>
        /* Layout tuning: edit these values to adjust spacing and sizing. */
        :root {
            --window-padding-vertical: 0px;
            --window-padding-horizontal: 0px;
            --grid-horizontal-inset: 0px;
            /* Extra space beyond window and app padding.
            It only changes the cell size when width is limiting the board; if height is already the limiting factor, it may have no visible effect. */
            --grid-vertical-inset: 0px;
            /* Extra space beyond window and app padding. */
            --app-padding-top: 10px;
            --app-padding-bottom: 20px;
            --app-padding-horizontal: 20px;
            --header-grid-gap: 10px;
            --cell-size: 80px;
            --grid-column-gap: 0px;
            --grid-row-gap: 0px;
            --cell-size-min: 20px;
            --cell-size-max: 160px;
            /* The responsive layout shrinks cells to fit smaller screens. */
            --stone-inset: 2px;
            /* Space inside each cell around its stone. */
            --selected-stone-lift: 0px;
            --selected-stone-scale: 1.02;
            --selection-ring-width: 3px;
            /* calc(2.5px + (var(--grid-column-gap) + var(--grid-row-gap)) * 0.25 - var(--cell-size) * 0.01); */
            --cell-height: var(--cell-size);
            --cell-padding-top: 0px;
            --plate-extra-h: 0px;
        }

        body {
            margin: 0;
            padding: var(--window-padding-vertical) var(--window-padding-horizontal);
            width: 100vw;
            height: var(--visible-viewport-height, 100vh);
            position: fixed;
            top: var(--visible-viewport-top, 0px);
            left: 0;
            box-sizing: border-box;
            background-color: var(--page-background, #e5e7eb);
            background-image: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.12) 42%, transparent 76%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: ui-sans-serif, system-ui, sans-serif;
        }

        #workspace {
            width: fit-content;
            height: fit-content;
            max-width: 100%;
            max-height: 100%;
            background-color: var(--workspace-background, #ffffff);
            border-radius: 12px;
            box-shadow: 0 0 24px #0f172a33, 0 0 8px rgba(15, 23, 42, 0.12);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: var(--app-padding-top) var(--app-padding-horizontal) var(--app-padding-bottom);
            box-sizing: border-box;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.2s ease-in;
        }

        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        /* ── GAME-BOARD style (default) ── */
        .stone-effect {
            border-radius: 50%;
            background-image: none;
            box-shadow:
                inset 0px 0px 5px 2px rgba(255, 255, 255, 0.5),
                inset 0px 0px 0px 2px rgba(255, 255, 255, 0.5),
                0px 0px 4px 1px rgba(125, 125, 125, 0.5),
                0px 0px 0px 1px rgba(125, 125, 125, 0.5);
            transition: all 0.2s ease-out;
        }

        .stone-effect-active {
            box-shadow:
                inset 0px 0px 5px 2px rgba(255, 255, 255, 0.5),
                inset 0px 0px 0px 2px rgba(255, 255, 255, 0.5),
                0px 0px 10px 5px rgba(125, 125, 125, 0.5);
            transform: translateY(calc(var(--selected-stone-lift) * -1)) scale(var(--selected-stone-scale));
            transition: all 0.2s ease-out;
            z-index: 6;
        }

        .note-engraved-text {
            color: #ffffff;
            font-weight: 600;
            text-shadow:
                0 0 2px rgba(255, 255, 255, 0.62),
                0 0 5px rgba(255, 255, 255, 0.28),
                0 0 2px rgba(0, 0, 0, 0.95),
                0 0 4px rgba(0, 0, 0, 0.75);
            padding-top: calc(0.5rem - 0.08em);
            padding-bottom: calc(0.5rem + 0.08em);
        }

        /* ── NATURAL style ── applied when body has class 'style-natural' ── */
        body.style-natural .stone-effect {
            box-shadow:
                inset -6px -6px 12px rgba(30, 40, 50, 0.7),
                inset 4px 4px 8px rgba(255, 255, 255, 0.35),
                inset -1px -1px 3px rgba(255, 255, 255, 0.2),
                2px 4px 8px rgba(0, 0, 0, 0.3);
        }

        body.style-natural .stone-effect-active {
            box-shadow:
                inset -6px -6px 14px rgba(30, 40, 50, 0.8),
                inset 4px 4px 10px rgba(255, 255, 255, 0.4),
                4px 8px 18px rgba(0, 0, 0, 0.38);
            transform: translateY(calc(var(--selected-stone-lift) * -1)) scale(var(--selected-stone-scale));
            z-index: 6;
        }

        body.style-natural .note-engraved-text {
            color: rgba(255, 255, 255, 0.95);
            text-shadow: -1px -1px 2px rgba(0, 0, 0, 0.6), 1px 1px 1px rgba(255, 255, 255, 0.5);
        }

        /* ── TRAFFIC LIGHT style ── applied when body has class 'style-traffic' ── */
        body.style-traffic .stone-effect {
            /* Clean, modern signal lamp bezel + gentle glass lens reflection */
            box-shadow:
                0 0 0 2px rgba(24, 28, 35, 0.85),
                inset 0 1.5px 3.5px rgba(255, 255, 255, 0.38),
                inset 0 -2px 5px rgba(0, 0, 0, 0.35),
                0 2px 5px rgba(0, 0, 0, 0.22);
            background-image:
                radial-gradient(ellipse at 50% 20%, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.08) 35%, transparent 65%);
        }

        body.style-traffic .stone-effect-active {
            box-shadow:
                0 0 0 2.5px rgba(18, 22, 28, 0.95),
                inset 0 2px 4.5px rgba(255, 255, 255, 0.48),
                inset 0 -2.5px 6px rgba(0, 0, 0, 0.42),
                0 4px 10px rgba(0, 0, 0, 0.32);
            background-image:
                radial-gradient(ellipse at 50% 20%, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.1) 35%, transparent 65%);
            transform: translateY(calc(var(--selected-stone-lift) * -1)) scale(var(--selected-stone-scale));
            z-index: 6;
        }

        body.style-traffic .note-engraved-text {
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
            letter-spacing: 0.01em;
        }

        /* ── Strike-through note styles (double line-through effect) ── */
        .note-line-through,
        .note-double-line-through {
            text-decoration: line-through double !important;
            text-decoration-line: line-through !important;
            text-decoration-style: double !important;
            text-decoration-thickness: max(1px, 0.08em) !important;
            text-decoration-color: currentColor !important;
            opacity: 0.8 !important;
            animation: none !important;
        }

        .note-white.note-line-through,
        .note-white .note-line-through,
        .note-white.note-double-line-through,
        .note-white .note-double-line-through {
            text-decoration-color: #334155 !important;
        }

        /* ── CELL PLATE (Invisible: cells exist structurally, but are visually transparent) ── */
        .cell-plate-surface {
            display: none !important;
        }

        .grid-cell {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        #multi-cell-selection-box {
            position: relative;
            width: 100%;
            height: 100%;
            align-self: stretch;
            justify-self: stretch;
            border: 2px dashed var(--selection-ring-color, #eab308);
            border-radius: 14px;
            box-shadow: 0 0 10px color-mix(in srgb, var(--selection-ring-color, #eab308) 35%, transparent);
            pointer-events: none !important;
            box-sizing: border-box;
            z-index: 52;
            transition: opacity 0.15s ease;
        }

        body.is-dragging-stone #multi-cell-selection-box {
            opacity: 0.35;
        }

        /* Stones themselves are always static, horizontal and legible */
        .stone-effect {
            animation: none !important;
        }

        .cell-underline-dock {
            position: absolute;
            top: calc(var(--cell-size) - 18px);
            left: 50%;
            width: 72%;
            max-width: calc(100% - 8px);
            height: 18px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 8;
            box-sizing: border-box;
            border-radius: 9999px;
            transform: translateX(-50%);
            transition: opacity 0.2s ease;
        }

        .grid-cell:not(.cell-status-normal) .cell-underline-dock {
            background: rgba(255, 255, 255, 0.82);
            box-shadow: 0 1px 5px rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(2px);
        }

        .grid-cell.cell-status-normal .cell-underline-dock .underline-svg {
            display: none !important;
        }

        .grid-cell .cell-underline-dock.has-status-timer {
            background: #dbeafe;
            box-shadow: 0 1px 5px rgba(96, 165, 250, 0.55);
        }

        .underline-svg {
            display: block;
            overflow: visible;
            max-width: 85%;
            max-height: 100%;
            color: #f59e0b;
            /* Golden amber matching user sketch */
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.4));
            transition: opacity 0.2s ease, filter 0.2s ease, transform 0.2s ease;
        }

        /* Dim underline while editing text */
        .grid-cell:has(#note-edit-input) .underline-svg,
        .grid-cell:has([contenteditable="true"]) .underline-svg {
            opacity: 0.35 !important;
        }

        /* Dim and pause underline when note is filtered out (unless hovered or active) */
        .note-filtered-out:not(.is-selected):not(:hover):not(.has-menu) .underline-svg {
            opacity: 0.1 !important;
            animation: none !important;
        }

        .note-filtered-out:hover .underline-svg,
        .note-filtered-out.has-menu .underline-svg {
            opacity: 1 !important;
        }

        /* Status Underlines */
        .underline-triple {
            color: #ef4444;
            opacity: 1;
            filter: drop-shadow(0 0 2px rgba(239, 68, 68, 0.45));
        }

        .underline-vertical {
            color: #8b4513;
            opacity: 1;
            filter: drop-shadow(0 0 2px rgba(139, 69, 19, 0.45));
        }

        .underline-double {
            color: #f97316;
            opacity: 1;
            filter: drop-shadow(0 0 2px rgba(249, 115, 22, 0.45));
        }

        .underline-single {
            color: #f59e0b;
            opacity: 1;
            filter: drop-shadow(0 0 2px rgba(245, 158, 11, 0.4));
        }

        .underline-wave {
            color: #d946ef;
            opacity: 1;
            filter: drop-shadow(0 0 2px rgba(217, 70, 239, 0.45));
        }

        .underline-dashed {
            color: #3b82f6;
            opacity: 0.95;
            filter: drop-shadow(0 0 2px rgba(59, 130, 246, 0.45));
        }

        .underline-checkmark {
            color: #22c55e;
            opacity: 0.95;
            filter: drop-shadow(0 0 4px rgba(34, 197, 94, 0.7));
        }

        .underline-zigzag {
            color: #4b5563;
            opacity: 1;
            filter: drop-shadow(0 0 2px rgba(75, 85, 99, 0.45));
        }

        /* Context Menus & Dropdown Styling */
        #context-menu {
            position: fixed !important;
            z-index: 1000 !important;
            box-sizing: border-box;
            width: max-content !important;
            background: #ffffff;
            background-color: #ffffff;
            opacity: 1;
            border: 1px solid rgba(209, 213, 219, 0.85);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.16), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            overflow: hidden;
            max-height: 80vh;
        }

        /* Thumbtack menus: 100% opaque, no transparency */
        #context-menu.menu-thumbtack,
        #context-menu[data-menu-type="grid"],
        #context-menu[data-menu-type="colors"],
        #context-menu[data-menu-type="style"],
        #context-menu[data-menu-type="filter"] {
            opacity: 1 !important;
            background: #ffffff !important;
            background-color: #ffffff !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        /* Grid cell menus: keep transparency */
        #context-menu.menu-cell,
        #context-menu.menu-opacity-90,
        #context-menu[data-menu-type="status"],
        #context-menu[data-menu-type="color"],
        #context-menu[data-menu-type="font"] {
            opacity: 0.9 !important;
            background: rgba(255, 255, 255, 0.9) !important;
            background-color: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
        }

        #context-menu[data-menu-type="timer"] {
            opacity: 0.98 !important;
            background: rgba(255, 255, 255, 0.98) !important;
        }

        .menu-font-container {
            min-width: 170px;
            width: max-content;
            padding: 8px 0;
            box-sizing: border-box;
        }

        .menu-font-item {
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .menu-font-item:hover {
            background-color: rgba(239, 246, 255, 0.9);
        }

        .menu-status-container {
            min-width: 170px;
            width: max-content;
            padding: 8px 0;
            box-sizing: border-box;
        }

        .menu-status-item {
            padding: 7px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .menu-status-item:hover {
            background-color: rgba(239, 246, 255, 0.9);
        }

        .menu-timer-container {
            width: 218px;
            padding: 10px;
            box-sizing: border-box;
        }

        .timer-choice {
            min-width: 0;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            background: #fff;
            padding: 4px 2px;
            color: #374151;
            font-size: 10px;
            line-height: 14px;
            cursor: pointer;
        }

        .timer-choice[aria-pressed="true"] {
            border-color: #3b82f6;
            background: #eff6ff;
            color: #1d4ed8;
            font-weight: 600;
        }

        .timer-status-choice {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .timer-status-dot {
            width: 7px;
            height: 7px;
            flex: 0 0 auto;
            border-radius: 50%;
        }

        .menu-color-palette {
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(6, 26px);
            gap: 8px;
            width: max-content;
            box-sizing: border-box;
        }

        .menu-filter-container {
            min-width: 175px;
            width: max-content;
            padding: 8px 0;
            box-sizing: border-box;
        }

        .menu-filter-item {
            padding: 7px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .menu-filter-item:hover {
            background-color: rgba(239, 246, 255, 0.9);
        }

        .menu-panel-container {
            padding: 12px 16px;
            box-sizing: border-box;
        }

        /* ── TRASH target thumbtack styles & expanded drop zone ── */
        #btn-trash,
        #btn-trash-right {
            position: relative;
            overflow: visible !important;
            transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), background 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        /* Expanded drop hitbox indicator pad (pseudo-element) */
        #btn-trash::before,
        #btn-trash-right::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
            box-sizing: border-box;
            transition: opacity 0.15s ease, background 0.15s ease;
        }

        /* Keep the trash icon visually quiet; the 24px target provides the drop area. */
        #btn-trash::after,
        #btn-trash-right::after {
            display: none;
        }

        /* Active drag state: indicate the drop target without enlarging the icon. */
        body.is-dragging-stone #btn-trash,
        body.is-dragging-stone #btn-trash-right {
            transform: none;
            border-color: rgba(239, 68, 68, 0.45);
            box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.18);
        }

        body.is-dragging-stone #btn-trash::before,
        body.is-dragging-stone #btn-trash-right::before {
            opacity: 1;
            background: rgba(239, 68, 68, 0.08);
        }

        /* Keep the drop target subtle while a note is over it. */
        #btn-trash.trash-drag-over,
        #btn-trash-right.trash-drag-over {
            background: rgba(239, 68, 68, 0.16) !important;
            transform: none !important;
            border-color: rgba(239, 68, 68, 0.55) !important;
            box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.2) !important;
        }

        #btn-trash.trash-drag-over::before,
        #btn-trash-right.trash-drag-over::before {
            opacity: 1;
            background: rgba(239, 68, 68, 0.12) !important;
        }

        #btn-trash:hover,
        #btn-trash-right:hover,
        #btn-trash:active,
        #btn-trash-right:active {
            transform: none;
        }

        .title-text-effect {
            text-shadow: 0 1px 3px rgba(15, 23, 42, 0.3);
        }

        .note-white {
            background-color: #eff7ff;
        }

        .note-stone-gray {
            background-color: #a8a29e;
        }

        .dragging {
            opacity: 0.85 !important;
        }

        .thumbtack {
            width: 24px;
            height: 24px;
            min-width: 24px;
            min-height: 24px;
            aspect-ratio: 1;
            background: radial-gradient(circle at 35% 30%, #4b5563 0%, #273244 52%, #111827 100%);
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.38);
            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.32),
                inset 0 1px 3px rgba(255, 255, 255, 0.3),
                inset 0 -3px 6px rgba(0, 0, 0, 0.45);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
            z-index: 85;
            position: relative;
            flex: 0 0 24px;
        }

        .thumbtack:hover {
            transform: scale(1.15);
            color: #ffffff;
            background: radial-gradient(circle at 35% 30%, #64748b 0%, #334155 52%, #172033 100%);
        }

        .thumbtack:active {
            transform: scale(0.95);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35), inset 0 2px 6px rgba(0, 0, 0, 0.5), inset 0 0 4px rgba(255, 255, 255, 0.25);
        }

        .thumbtack:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: 3px;
        }

        .thumbtack.thumbtack-active {
            background: radial-gradient(circle at 35% 30%, #3b82f6 0%, #1d4ed8 52%, #1e3a8a 100%);
            border-color: rgba(147, 197, 253, 0.85);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.6), inset 0 1px 3px rgba(255, 255, 255, 0.45);
        }

        .thumbtack.thumbtack-active svg {
            color: #ffffff !important;
        }

        .thumbtack.thumbtack-active:hover {
            background: radial-gradient(circle at 35% 30%, #60a5fa 0%, #2563eb 52%, #1d4ed8 100%);
        }

        .note-filtered-out .stone-wrapper {
            opacity: 0.15;
            filter: grayscale(85%);
            transition: opacity 0.2s ease, filter 0.2s ease, transform 0.2s ease;
        }

        /* When hovering on a filtered cell or when it has active menu, show cell normally */
        .note-filtered-out:hover .stone-wrapper,
        .note-filtered-out.has-menu .stone-wrapper {
            opacity: 1 !important;
            filter: none !important;
        }

        .note-filtered-out:not(.is-selected):not(:hover):not(.has-menu) * {
            animation: none !important;
        }

        .note-filtered-out.is-selected .stone-wrapper {
            opacity: 0.82;
            filter: grayscale(35%);
        }

        .note-filtered-out.has-menu .stone-wrapper {
            opacity: 1 !important;
            filter: none !important;
        }

        .note-filtered-out-empty .cell-add-icon {
            opacity: 0.2 !important;
        }

        .thumbtack svg {
            width: 12px;
            height: 12px;
            stroke-width: 2.5;
            color: #22c55e;
        }

        .title-menu-button {
            width: 28px;
            height: 28px;
            min-width: 28px;
            min-height: 28px;
            aspect-ratio: 1;
            box-sizing: border-box;
            border-radius: 50%;
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.25), inset 0 0 5px rgba(255, 255, 255, 0.95);
        }

        .title-menu-button svg,
        .title-menu-button span {
            color: #000000 !important;
            stroke: #000000;
        }

        /* ── Command buttons on stone (shown only when clicked / selected) ── */
        .stone-action-btn {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
            transition: opacity 0.15s ease, transform 0.15s ease, background-color 0.15s ease;
        }

        body:not(.has-window-selection):not(.is-marquee-selecting):not(.is-dragging-stone) .grid-cell.is-selected .stone-action-btn,
        body:not(.has-window-selection):not(.is-marquee-selecting):not(.is-dragging-stone) .grid-cell.has-menu .stone-action-btn,
        body:not(.has-window-selection):not(.is-marquee-selecting):not(.is-dragging-stone) .stone-action-btn.stone-menu-btn-visible {
            opacity: 1 !important;
            pointer-events: auto !important;
            visibility: visible !important;
            transform: scale(1);
            z-index: 25 !important;
        }

        .grid-cell.is-selected .stone-action-btn:hover,
        .grid-cell.has-menu .stone-action-btn:hover,
        .stone-action-btn.stone-menu-btn-visible:hover {
            transform: scale(1.15) !important;
            background-color: #f1f5f9;
        }

        .grid-cell {

            if (str === 'checkmark' || str === 'completed' || str === 'done' || str === 'linethrough') return 'checkmark';
            return statusModes.includes(str) ? str : null;
        }

        function normalizeStatusTimer(timer) {
            if (!timer || typeof timer !== 'object' || Array.isArray(timer)) return null;
            if (!Number.isSafeInteger(timer.dueAt) || timer.dueAt <= 0) return null;
            if (Array.isArray(timer.statuses)) {
                return {
                    statuses: getNoteStatuses(timer.statuses),
                    dueAt: timer.dueAt
                };
            }
            if (timer.action === 'set' || timer.action === 'clear') {
                const status = canonicalStatus(timer.status);
                if (timer.action === 'set' && !status) return null;
                return { statuses: timer.action === 'set' ? [status] : [], dueAt: timer.dueAt };
            }
            return null;
        }

        function getNoteStatuses(noteOrStatuses) {
            if (!noteOrStatuses) return [];
            let rawList = [];
            if (Array.isArray(noteOrStatuses)) {
                rawList = noteOrStatuses;
            } else if (typeof noteOrStatuses === 'object') {
                if (Array.isArray(noteOrStatuses.statuses)) rawList = noteOrStatuses.statuses;
                else if (Array.isArray(noteOrStatuses.status)) rawList = noteOrStatuses.status;
                else if (noteOrStatuses.status) rawList = [noteOrStatuses.status];
                else if (noteOrStatuses.blinking) rawList = [noteOrStatuses.blinking];
            } else if (typeof noteOrStatuses === 'string') {
                rawList = [noteOrStatuses];
            }
            const result = [];
            rawList.forEach(item => {
                const c = canonicalStatus(item);
                if (c && !result.includes(c)) result.push(c);
            });
            return result.slice(0, 1);
        }

            const availH = viewportHeight - 2 * windowPadY - appPadTop - appPadBottom - extraGridInsetY - headerHeight;

            const maxCellW = (availW - (totalCols - 1) * columnGapSize) / totalCols;
            const maxCellH = (availH - (totalRows - 1) * rowGapSize) / totalRows;

            let size = Math.min(maxCellW, maxCellH);
            size = Math.max(minCellSize, Math.min(size, maxCellSize));
            const cellH = size;

            document.documentElement.style.setProperty('--cell-size', `${size}px`);
            document.documentElement.style.setProperty('--cell-padding-top', '0px');

        // Dynamically maintain exact radial boundary cursor:
        // Inside circle = grab (pan) or text (if editing)

        gridElement.addEventListener('mousemove', (e) => {
            const cell = e.target.closest('.grid-cell');
            if (!cell) return;
            const cellIdx = parseInt(cell.id.replace('grid-cell-', ''), 10);

            if (document.body.classList.contains('is-dragging-stone')) {
                cell.style.cursor = 'grabbing';
                const circle = cell.querySelector('.stone-effect');
                if (circle) circle.style.cursor = 'grabbing';

            // When a window selection is active, cells within the selection show grab cursor

                cell.style.cursor = 'grab';

                if (circle) circle.style.cursor = 'grab';
                return;
            }

            const circle = cell.querySelector('.stone-effect');
            if (circle) {
                const r = circle.getBoundingClientRect();
                const radius = r.width / 2;
                const cx = r.left + radius;
                const cy = r.top + radius;
                const distSq = (e.clientX - cx) ** 2 + (e.clientY - cy) ** 2;
                if (distSq <= radius ** 2) {
                    const isEditing = circle.querySelector('#note-edit-input') || circle.isContentEditable;

        function normalizeImportedData(rawData) {
            if (!rawData || typeof rawData !== 'object' || Array.isArray(rawData) || !Array.isArray(rawData.notes)) {
                throw new Error('Unsupported save format');
            }

            let parsedCols = null;
            let parsedRows = null;

            if (Number.isInteger(rawData.cols) && Number.isInteger(rawData.rows) && rawData.cols >= 1 && rawData.rows >= 1) {
                parsedCols = rawData.cols;
                parsedRows = rawData.rows;
            } else if (Number.isInteger(rawData.totalCols) && Number.isInteger(rawData.totalRows) && rawData.totalCols >= 1 && rawData.totalRows >= 1) {
                parsedCols = rawData.totalCols;
                parsedRows = rawData.totalRows;
            } else if (Number.isInteger(rawData.coreCols) && Number.isInteger(rawData.coreRows) && rawData.coreCols >= 1 && rawData.coreRows >= 1) {
                const mL = Number.isInteger(rawData.mL) ? rawData.mL : 0;
                const mR = Number.isInteger(rawData.mR) ? rawData.mR : 0;
                const mT = Number.isInteger(rawData.mT) ? rawData.mT : 0;
                const mB = Number.isInteger(rawData.mB) ? rawData.mB : 0;
                parsedCols = mL + rawData.coreCols + mR;
                parsedRows = mT + rawData.coreRows + mB;
            } else {
                throw new Error('Unsupported save format');
            }

            if (rawData.notes.length !== parsedCols * parsedRows) throw new Error('Unsupported save format');

            return {
                totalCols: parsedCols,
                totalRows: parsedRows,
                columnGap: Number.isFinite(rawData.columnGap) ? Math.round(Math.max(0, Math.min(100, rawData.columnGap))) : 0,
                rowGap: Number.isFinite(rawData.rowGap) ? Math.round(Math.max(0, Math.min(100, rawData.rowGap))) : 0,
                notes: rawData.notes,
                titleState: rawData.titleState || null,
                titleColorVersion: rawData.titleColorVersion || null,
                pageColorIndex: Number.isInteger(rawData.pageColorIndex) ? rawData.pageColorIndex : null,
                workspaceColorIndex: Number.isInteger(rawData.appColorIndex) ? rawData.appColorIndex : null,
                cellStyle: rawData.cellStyle || null,
                filterSettings: Array.isArray(rawData.filterSettings) ? rawData.filterSettings.filter(f => ALL_STATUS_FILTERS.includes(f)) : null
            };
        }

        function applyLoadedData(data) {
            totalCols = data.totalCols; totalRows = data.totalRows;
            columnGap = data.columnGap;
            rowGap = data.rowGap;
            notes = data.notes;
            notes.forEach(n => {
                if (n) {
                    const statusTimer = normalizeStatusTimer(n.statusTimer);
                    if (statusTimer) n.statusTimer = statusTimer;
                    else delete n.statusTimer;
                    if (n.opacity !== undefined) delete n.opacity;
                    if (n.blinking && !n.status) n.status = n.blinking;
                    if (n.status === 'completed' || n.status === 'done' || n.status === 'linethrough') {
                        n.status = 'completed';
                        delete n.strike;
                    }
                    n.statuses = getNoteStatuses(n);
                    if (n.statuses.length > 0) {
                        n.status = n.statuses[0];
                    } else {
                        delete n.status;
                    }
                    delete n.blinking;
                    delete n.strike;
                }
            });
            if (data.titleState) {
                let loadedTitle = { ...data.titleState };
                if (loadedTitle.text === 'Note Stones') loadedTitle.text = 'Tiny Notes';
                if (!data.titleColorVersion && Number.isInteger(loadedTitle.colorIndex) && loadedTitle.colorIndex >= 0 && loadedTitle.colorIndex < 12) {
                    const titlePaletteMap = [11, 10, 4, 5, 6, 8, 7, 9, 3, 2, 1, 0];
                    loadedTitle.colorIndex = titlePaletteMap[loadedTitle.colorIndex];
                }
                titleState = { ...titleState, ...loadedTitle, isMenuOpen: false, isEditing: false };
            }
            if (data.pageColorIndex !== null && data.pageColorIndex >= 0 && data.pageColorIndex < pageColors.length) pageColorIndex = data.pageColorIndex;
            if (data.workspaceColorIndex !== null && data.workspaceColorIndex >= 0 && data.workspaceColorIndex < workspaceColors.length) workspaceColorIndex = data.workspaceColorIndex;
            if (data.cellStyle === 'game' || data.cellStyle === 'natural' || data.cellStyle === 'traffic') cellStyle = data.cellStyle;
            if (Array.isArray(data.filterSettings)) {
                filterStatusSet.clear();
                data.filterSettings.forEach(f => {
                    if (ALL_STATUS_FILTERS.includes(f)) filterStatusSet.add(f);

            applyStyleSettings();

        function loadData() {
            try {

                    } catch (e) {
                        console.warn('Could not load current saved data', e);

        function applyBackgroundColors() {

        let statusTimerTimeout = null;

        function saveData() {
            try {
                const data = {
                    cols: totalCols,
                    rows: totalRows,
                    totalCols,

                    rowGap,

        // Header menus management and staged grid sizing

        function initGridDraft() {

        function canDraftRemoveRow(side) {
            if (!gridDraft || gridDraft.rows <= 1) return false;
            const cols = gridDraft.cols;
            const rows = gridDraft.rows;
            if (side === 'top') {
                for (let c = 0; c < cols; c++) {
                    if (gridDraft.notes[c] !== null) return false;
                }
                return true;
            }
            const rowStart = (rows - 1) * cols;
            for (let c = 0; c < cols; c++) {
                if (gridDraft.notes[rowStart + c] !== null) return false;
            }
            return true;
        }

        function canDraftRemoveCol(side) {
            if (!gridDraft || gridDraft.cols <= 1) return false;
            const cols = gridDraft.cols;
            const rows = gridDraft.rows;
            if (side === 'left') {
                for (let r = 0; r < rows; r++) {
                    if (gridDraft.notes[r * cols] !== null) return false;
                }
                return true;
            }
            for (let r = 0; r < rows; r++) {
                if (gridDraft.notes[r * cols + cols - 1] !== null) return false;
            }
            return true;
        }

        window.draftAddEdge = function (side) {
            if (!gridDraft) initGridDraft();
            const cols = gridDraft.cols;
            const rows = gridDraft.rows;
            if (side === 'bottom') {
                gridDraft.notes = gridDraft.notes.concat(Array(cols).fill(null));
                gridDraft.rows++;
            } else if (side === 'top') {
                gridDraft.notes = Array(cols).fill(null).concat(gridDraft.notes);
                gridDraft.rows++;
            } else if (side === 'right') {
                const newNotes = [];
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) newNotes.push(gridDraft.notes[r * cols + c]);
                    newNotes.push(null);
                }
                gridDraft.notes = newNotes;
                gridDraft.cols++;
            } else if (side === 'left') {
                const newNotes = [];
                for (let r = 0; r < rows; r++) {
                    newNotes.push(null);
                    for (let c = 0; c < cols; c++) newNotes.push(gridDraft.notes[r * cols + c]);
                }
                gridDraft.notes = newNotes;
                gridDraft.cols++;

        window.draftRemoveEdge = function (side) {

            if (side === 'bottom') {

                const rowStart = (gridDraft.rows - 1) * gridDraft.cols;
                gridDraft.notes = gridDraft.notes.slice(0, rowStart);
                gridDraft.rows--;
            } else if (side === 'top') {
                if (!canDraftRemoveRow('top')) return;
                gridDraft.notes = gridDraft.notes.slice(gridDraft.cols);
                gridDraft.rows--;
            } else if (side === 'right') {
                if (!canDraftRemoveCol('right')) return;
                const newNotes = [];
                const cols = gridDraft.cols;
                const rows = gridDraft.rows;
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols - 1; c++) newNotes.push(gridDraft.notes[r * cols + c]);
                }
                gridDraft.notes = newNotes;
                gridDraft.cols--;
            } else if (side === 'left') {
                if (!canDraftRemoveCol('left')) return;
                const newNotes = [];
                const cols = gridDraft.cols;
                const rows = gridDraft.rows;
                for (let r = 0; r < rows; r++) {

            renderGridMenuContent();
        };


        function applyGridDraft() {

        let activeMenuResizeObserver = null;

        function getActiveMenuStoneRect(anchorElement = null) {
            if (anchorElement && anchorElement.closest) {
                const cell = anchorElement.closest('.grid-cell');
                const circle = cell?.querySelector('.stone-effect') || cell?.querySelector('.stone-wrapper');
                if (circle) return circle.getBoundingClientRect();
            }
            const nIdx = contextMenu.dataset.noteIndex;
            if (nIdx && nIdx !== 'title') {
                const cell = document.getElementById(`grid-cell-${nIdx}`);
                const circle = cell?.querySelector('.stone-effect') || cell?.querySelector('.stone-wrapper');

            }
            return null;
        }

        function computeAndApplyMenuPosition() {
            if (!contextMenu || contextMenu.classList.contains('hidden') || !activeMenuPosState) return;
            const { x, y, anchorElement, alignMode } = activeMenuPosState;
            const margin = 10;
            const vv = window.visualViewport;
            const vpW = vv ? vv.width : (document.documentElement.clientWidth || window.innerWidth);
            const vpH = vv ? vv.height : (document.documentElement.clientHeight || window.innerHeight);
            const vpL = vv ? vv.offsetLeft : 0;
            const vpT = vv ? vv.offsetTop : 0;

            contextMenu.style.maxWidth = `${Math.max(0, vpW - 2 * margin)}px`;
            contextMenu.style.maxHeight = `${Math.max(0, vpH - 2 * margin)}px`;

            const rect = contextMenu.getBoundingClientRect();
            if (rect.width === 0 && rect.height === 0) return;

            const anchorRect = anchorElement ? anchorElement.getBoundingClientRect() : null;
            const stoneRect = getActiveMenuStoneRect(anchorElement);

            let posX, posY;
            if (alignMode === 'timer') {
                const targetElement = selectedNotes.size > 1
                    ? document.getElementById('multi-cell-selection-box')
                    : document.getElementById(`grid-cell-${contextMenu.dataset.noteIndex}`);
                const targetRect = targetElement?.getBoundingClientRect() || stoneRect;
                if (!targetRect) return;
                const spaceLeft = targetRect.left - margin;
                const spaceRight = vpL + vpW - margin - targetRect.right;
                const spaceBelow = vpT + vpH - margin - targetRect.bottom;
                const spaceAbove = targetRect.top - (vpT + margin);

                if (spaceLeft >= rect.width || spaceRight >= rect.width) {
                    posX = spaceLeft >= rect.width && (spaceLeft >= spaceRight || spaceRight < rect.width)
                        ? targetRect.left - rect.width - 8
                        : targetRect.right + 8;
                    posY = targetRect.top + (targetRect.height - rect.height) / 2;
                } else if (spaceBelow >= rect.height || spaceAbove >= rect.height) {
                    posX = targetRect.left + (targetRect.width - rect.width) / 2;
                    posY = spaceBelow >= rect.height
                        ? targetRect.bottom + 8
                        : targetRect.top - rect.height - 8;
                } else {
                    posX = spaceLeft >= spaceRight
                        ? targetRect.left - rect.width - 8
                        : targetRect.right + 8;
                    posY = targetRect.top + (targetRect.height - rect.height) / 2;
                }
            } else if (stoneRect && (alignMode === 'left' || alignMode === 'right')) {
                const spaceLeft = (stoneRect.left - 10) - (vpL + margin);
                const spaceRight = (vpL + vpW - margin) - (stoneRect.right + 10);
                const preferLeft = (alignMode === 'left');

                if (preferLeft && spaceLeft >= rect.width) {
                    posX = stoneRect.left - rect.width - 10;
                } else if (!preferLeft && spaceRight >= rect.width) {
                    posX = stoneRect.right + 10;
                } else if (spaceRight >= rect.width) {
                    posX = stoneRect.right + 10;
                } else if (spaceLeft >= rect.width) {
                    posX = stoneRect.left - rect.width - 10;
                } else {
                    const spaceBelow = (vpT + vpH - margin) - (stoneRect.bottom + 10);
                    if (spaceBelow >= rect.height) {
                        posY = stoneRect.bottom + 10;
                    } else {
                        posY = Math.max(vpT + margin, stoneRect.top - rect.height - 10);
                    }
                    posX = Math.min(Math.max(stoneRect.left + (stoneRect.width - rect.width) / 2, vpL + margin), vpL + vpW - rect.width - margin);
                }

                if (posY === undefined) {
                    const targetCenterY = anchorRect ? (anchorRect.top + anchorRect.height / 2) : (stoneRect.top + stoneRect.height / 2);
                    posY = targetCenterY - rect.height / 2;
                    posY = Math.min(Math.max(posY, vpT + margin), vpT + vpH - rect.height - margin);
                }
            } else if (alignMode === 'left') {
                const targetCenterY = anchorRect ? (anchorRect.top + anchorRect.height / 2) : (y - window.scrollY);
                posY = targetCenterY - rect.height / 2;

                const idealLeft = anchorRect ? (anchorRect.left - rect.width - 8) : (x - window.scrollX - rect.width - 8);
                if (idealLeft >= vpL + margin) {
                    posX = idealLeft;
                } else {
                    posX = anchorRect ? (anchorRect.right + 8) : (x - window.scrollX + 8);
                }
            } else if (alignMode === 'right') {
                const targetCenterY = anchorRect ? (anchorRect.top + anchorRect.height / 2) : (y - window.scrollY);
                posY = targetCenterY - rect.height / 2;

                const idealRight = anchorRect ? (anchorRect.right + 8) : (x - window.scrollX + 8);
                if (idealRight + rect.width <= vpL + vpW - margin) {
                    posX = idealRight;
                } else {
                    posX = anchorRect ? (anchorRect.left - rect.width - 8) : (x - window.scrollX - rect.width - 8);
                }
            } else if (alignMode === 'center') {
                const targetCenterX = anchorRect ? (anchorRect.left + anchorRect.width / 2) : (x - window.scrollX);
                const targetCenterY = anchorRect ? (anchorRect.top + anchorRect.height / 2) : (y - window.scrollY);
                posX = targetCenterX - rect.width / 2;
                posY = targetCenterY - rect.height / 2;
            } else if (anchorRect) {
                posX = anchorRect.left;
                posY = anchorRect.bottom + 8;
                // If it overflows bottom, flip above anchor if there is space
                if (posY + rect.height > vpT + vpH - margin && anchorRect.top - rect.height - 8 >= vpT + margin) {
                    posY = anchorRect.top - rect.height - 8;
                }
            } else {
                posX = x - window.scrollX;
                posY = y - window.scrollY;
            }

            // Clamping within viewport
            posX = Math.min(posX, vpL + vpW - rect.width - margin);
            posY = Math.min(posY, vpT + vpH - rect.height - margin);
            posX = Math.max(vpL + margin, posX);
            posY = Math.max(vpT + margin, posY);

            if (Math.abs(parseFloat(contextMenu.style.left) - posX) > 0.5) {
                contextMenu.style.left = `${posX}px`;
            }
            if (Math.abs(parseFloat(contextMenu.style.top) - posY) > 0.5) {
                contextMenu.style.top = `${posY}px`;
            }
        }

        function positionMenu(x, y, anchorElement = null, alignMode = 'default') {

                y = activeMenuPosState.y;

            const vpW = vv ? vv.width : (document.documentElement.clientWidth || window.innerWidth);
            const vpH = vv ? vv.height : (document.documentElement.clientHeight || window.innerHeight);
            const vpL = vv ? vv.offsetLeft : 0;
            const vpT = vv ? vv.offsetTop : 0;

            }

        function closeContextMenu() {

        function commitAutoUpdateStatusMenu() {
            if (contextMenu.dataset.menuType !== 'timer') return false;
            const durationInput = document.getElementById('status-timer-duration');
            if (!durationInput) return false;

            const duration = durationInput.valueAsNumber;
            if (!Number.isSafeInteger(duration) || duration < 0) {
                durationInput.setCustomValidity('Enter a whole number that is zero or greater.');
                durationInput.reportValidity();
                return null;
            }
            durationInput.setCustomValidity('');

            const selectedUnit = contextMenu.querySelector('[data-timer-unit][aria-pressed="true"]')?.dataset.timerUnit;
            if (selectedUnit !== 'hours' && selectedUnit !== 'days') {
                throw new Error('Select a valid auto-update time unit.');
            }
            const delay = duration * (selectedUnit === 'days' ? 86400000 : 3600000);
            const dueAt = Date.now() + delay;
            if (!Number.isSafeInteger(dueAt) || dueAt > 8640000000000000) {
                durationInput.setCustomValidity('The selected duration is too large.');
                durationInput.reportValidity();
                return null;
            }

            const statuses = statusModes.filter(status =>
                contextMenu.querySelector(`[data-timer-status="${status}"]`)?.getAttribute('aria-pressed') === 'true'
            );
            const targets = JSON.parse(contextMenu.dataset.timerTargets || '[]').filter(index => notes[index]);
            targets.forEach(index => {
                if (duration === 0) {
                    applyStatusTimer(notes[index], { statuses, dueAt });
                    return;
                }
                notes[index].statusTimer = { statuses, dueAt };
                // Scheduling the status the note already has clears it until the timer fires
                if (statuses.length > 0 && getNoteStatuses(notes[index])[0] === statuses[0]) {
                    notes[index].statuses = [];
                    notes[index].status = false;
                    updateNoteStatusDisplay(index);
                }
            });
            if (targets.length === 0) return false;
            saveData();
            refreshStatusTimerButtons();
            return true;
        }

        function applyStatusTimer(note, timer) {
            const statuses = getNoteStatuses(timer.statuses);
            note.statuses = statuses;
            note.status = statuses[0] || false;
            delete note.blinking;
            delete note.strike;
            delete note.xMark;

        function processExpiredStatusTimers() {
            const now = Date.now();
            let changed = false;
            notes.forEach(note => {
                if (!note) return;
                const timer = normalizeStatusTimer(note.statusTimer);
                if (timer && timer.dueAt <= now) {
                    applyStatusTimer(note, timer);
                    changed = true;
                }
            });
            if (changed) {
                if (contextMenu.dataset.menuType === 'timer') closeContextMenu();
                saveData();
                renderGrid();
            }
        }

        function scheduleStatusTimers() {
            if (statusTimerTimeout !== null) {
                clearTimeout(statusTimerTimeout);
                statusTimerTimeout = null;
            }
            let nextDueAt = Infinity;
            notes.forEach(note => {
                if (!note) return;
                const timer = normalizeStatusTimer(note.statusTimer);
                if (timer && timer.dueAt < nextDueAt) nextDueAt = timer.dueAt;
            });
            if (Number.isFinite(nextDueAt)) {
                const delay = Math.max(0, Math.min(nextDueAt - Date.now(), 2147483647));
                statusTimerTimeout = setTimeout(() => {
                    statusTimerTimeout = null;
                    processExpiredStatusTimers();
                    scheduleStatusTimers();
                }, delay);
            }
        }

        function getRectangularSelectionIndices(indices) {
            if (indices.length === 0) return [];
            const rows = indices.map((idx) => Math.floor(idx / totalCols));
            const cols = indices.map((idx) => idx % totalCols);
            const minRow = Math.min(...rows);
            const maxRow = Math.max(...rows);
            const minCol = Math.min(...cols);
            const maxCol = Math.max(...cols);
            const rectangle = [];

            for (let row = minRow; row <= maxRow; row++) {
                for (let col = minCol; col <= maxCol; col++) {
                    rectangle.push(row * totalCols + col);
                }
            }
            return rectangle;
        }
